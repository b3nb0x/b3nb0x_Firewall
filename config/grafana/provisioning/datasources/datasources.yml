apiVersion: 1

# b3nsecu - Automatisch provisionierte Datenquellen
datasources:
  - name: b3nsecu-elk
    uid: b3nsecu-elk
    type: elasticsearch
    access: proxy
    url: http://localhost:9200
    isDefault: true
    jsonData:
      index: suricata-*
      interval: Daily
      timeField: "@timestamp"
      esVersion: 8.0.0
      maxConcurrentShardRequests: 5

  - name: b3nsecu-prometheus
    uid: b3nsecu-prom
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: false
    jsonData:
      timeInterval: 15s
