#!/usr/sbin/nft -f
#===============================================================================
# b3nsecu Firewall - nftables Grundregelsatz
# Platzhalter $IFACE_WAN / $IFACE_LAN werden vom Installer ersetzt.
#===============================================================================

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iifname "lo" accept
        ct state established,related accept

        # SSH nur aus dem LAN (kein Zugriff vom WAN)
        iifname != "$IFACE_WAN" tcp dport 22 accept

        # Monitoring/Management nur aus dem LAN
        iifname != "$IFACE_WAN" tcp dport { 9100, 9200, 5601, 3000 } accept

        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        limit rate 5/second log prefix "nft-drop-input: " level warning
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        # LAN -> WAN erlauben (Outbound)
        iifname "$IFACE_LAN" oifname "$IFACE_WAN" accept

        # WAN -> LAN: nur etablierte Verbindungen (implizit durch ct state)
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100;
        oifname "$IFACE_WAN" masquerade
    }
}
