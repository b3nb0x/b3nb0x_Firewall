#===============================================================================
# b3nsecu Debian-Preseed: Vollautomatische Installation
# Nutzung im Boot-Menue: "Automated install" oder Boot-Parameter:
#   auto=true priority=critical file=/cdrom/preseed/b3nsecu-preseed.cfg
#===============================================================================

#--- Lokalisierung ------------------------------------------------------------
d-i debian-installer/locale string de_DE.UTF-8
d-i keyboard-configuration/xkb-keymap select de
d-i keyboard-configuration/toggle select No toggling

#--- Netzwerk -----------------------------------------------------------------
# DHCP zuerst versuchen; bei Fehlschlag greifen die statischen Vorgaben
# (QEMU-slirp-Standard: 10.0.2.15/24, GW/DNS 10.0.2.2/10.0.2.3)
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string b3nsecu
d-i netcfg/get_domain string local
d-i netcfg/get_ipaddress string 10.0.2.15
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 10.0.2.2
d-i netcfg/get_nameservers string 8.8.8.8 1.1.1.1
d-i netcfg/confirm_static boolean true

#--- Spiegelserver (ueberspringt die Mirror-Fragen komplett) -------------------
# IP statt Hostname: QEMU-slirp hat kein IPv6 -> DNS-AAAA-Antworten scheitern.
d-i mirror/country string manual
d-i mirror/http/hostname string 151.101.2.132
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

#--- Nutzer anlegen ----------------------------------------------------------
# ACHTUNG: "admin" ist in Trixie als Username gesperrt -> b3nsecu verwenden!
# Default-Passwort: b3nsecu - UNBEDINGT nach Installation aendern!
# Eigenen Hash erzeugen:  openssl passwd -6 "DeinPasswort"
d-i passwd/user-fullname string b3nsecu admin
d-i passwd/username string b3nsecu
d-i passwd/user-password-crypted password $6$YfmyLIcxQRHZbCn4$OG028XMbvWe4ICTnHRFNVB20vxuqvktOQccBc3qJoqFSPYSHQFmJP5cgxkj.WgHvAhM5.bBulEFKkjkG86ECZ0
d-i passwd/user-default-groups string sudo adm netdev

#--- Uhrzeit -------------------------------------------------------------------
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Berlin
d-i clock-setup/ntp boolean true

#--- Partitionierung: GANZE PLATTE mit LVM (ACHTUNG: Daten werden geloescht!) --
d-i partman-auto/method string lvm
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

#--- Basis-System: minimal, Rest macht install.sh ------------------------------
d-i base-installer/install-recommends boolean false
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string openssh-server curl ca-certificates gnupg sudo
d-i pkgsel/upgrade select full
popularity-contest popularity-contest/participate boolean false

#--- GRUB: in den MBR/EFI der ersten Platte ------------------------------------
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

#--- Beenden: b3nsecu-Stack von der ISO installieren --------------------------
# Die ISO traegt unter /cdrom/b3nsecu/ unsere install.sh + config/ (includes.binary).
# Der late_command kopiert sie ins Zielsystem und fuehrt den Installer aus.
# Voraussetzung: funktionierendes Netz (fuer Elastic/Wazuh/Zeek-Repositorien).
d-i preseed/late_command string \
    in-target mkdir -p /opt/b3nsecu; \
    cp -r /cdrom/b3nsecu/* /target/opt/b3nsecu/; \
    in-target chmod +x /opt/b3nsecu/install.sh; \
    log-output -t b3nsecu sh -c 'chroot /target /opt/b3nsecu/install.sh --profile=full' || true

#--- Nach dem ersten Boot: Login als admin (Passwort siehe oben) --------------
